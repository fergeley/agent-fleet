name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check PowerShell 5.1 parser compatibility
        shell: powershell
        run: |
          foreach ($f in @("Install-AgentFleet.ps1", "install.ps1")) {
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($f, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) { throw "$($f): $($errors[0].Message)" }
          }
      - name: Run Windows Agent Fleet tests
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File tests/Test-Fleet.ps1

  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run Unix backend tests
        run: python3 -m unittest discover -s unix -p "test_*.py" -v
